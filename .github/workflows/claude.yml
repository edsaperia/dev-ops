# dev-ops uses its own builder: the test bed for the shared workflow.
name: claude
on:
  issue_comment: { types: [created] }
  pull_request_review_comment: { types: [created] }
  pull_request_review: { types: [submitted] }
  issues: { types: [opened] }
jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: edsaperia/dev-ops/.github/workflows/claude-builder.yml@main
    with:
      # per project: what the builder needs installed before it starts
      node-version: ''
      setup: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
